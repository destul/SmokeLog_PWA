<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e232d" />
      <stop offset="100%" stop-color="#0a0c0f" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff3d00" />
      <stop offset="50%" stop-color="#ff7043" />
      <stop offset="100%" stop-color="#ffca28" />
    </linearGradient>
  </defs>
  
  <!-- App Icon Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Glow Ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#ff5722" stroke-width="8" stroke-dasharray="16 12" opacity="0.3"/>
  
  <!-- Cigarette Silhouette -->
  <g transform="translate(136, 176)">
    <!-- Cigarette Body Filter -->
    <rect x="30" y="80" width="60" height="36" rx="6" fill="#e67e22"/>
    <!-- Cigarette Body Paper -->
    <rect x="94" y="80" width="120" height="36" rx="4" fill="#f5f6fa"/>
    <!-- Cigarette Ash Tip -->
    <rect x="214" y="80" width="18" height="36" rx="3" fill="#7f8c8d"/>
    <!-- Burning Ember Glow -->
    <circle cx="234" cy="98" r="14" fill="#ff5722" opacity="0.85"/>
    <circle cx="235" cy="98" r="8" fill="#ffeb3b"/>
  </g>
  
  <!-- Rising Smoke Stream -->
  <path d="M 370 240 Q 385 200 370 170 T 385 110 T 365 60" fill="none" stroke="#bdc3c7" stroke-width="12" stroke-linecap="round" opacity="0.45"/>
  <path d="M 390 230 Q 410 190 395 150 T 405 90" fill="none" stroke="#ecf0f1" stroke-width="8" stroke-linecap="round" opacity="0.3"/>
</svg>
